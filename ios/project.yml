# THROWAWAY SPIKE for issue #186. Generated into KeptSpike.xcodeproj by XcodeGen on CI;
# nobody needs Xcode to edit this. DEVELOPMENT_TEAM, CURRENT_PROJECT_VERSION and ENT_SUFFIX
# are passed on the xcodebuild command line by .github/workflows/ios-spike.yml.
name: KeptSpike
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENT_SUFFIX: ""
targets:
  KeptSpike:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - App
      - Shared
    info:
      path: Generated/App-Info.plist
      properties:
        CFBundleDisplayName: Habits vs
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zenai.kept.ios
        CODE_SIGN_ENTITLEMENTS: Entitlements/target$(ENT_SUFFIX).entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: Monitor
      - target: ShieldConfig
      - target: ShieldAction
  Monitor:
    type: app-extension
    platform: iOS
    sources:
      - Monitor
      - Shared
    info:
      path: Generated/Monitor-Info.plist
      properties:
        CFBundleDisplayName: Monitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zenai.kept.ios.monitor
        CODE_SIGN_ENTITLEMENTS: Entitlements/target$(ENT_SUFFIX).entitlements
  ShieldConfig:
    type: app-extension
    platform: iOS
    sources:
      - ShieldConfig
      - Shared
    info:
      path: Generated/ShieldConfig-Info.plist
      properties:
        CFBundleDisplayName: ShieldConfig
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zenai.kept.ios.shieldconfig
        CODE_SIGN_ENTITLEMENTS: Entitlements/target$(ENT_SUFFIX).entitlements
  ShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - ShieldAction
      - Shared
    info:
      path: Generated/ShieldAction-Info.plist
      properties:
        CFBundleDisplayName: ShieldAction
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zenai.kept.ios.shieldaction
        CODE_SIGN_ENTITLEMENTS: Entitlements/target$(ENT_SUFFIX).entitlements
