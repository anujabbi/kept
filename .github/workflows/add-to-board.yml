name: Add issue to board

# Every issue belongs on the KEPT board (AGENTS.md: "Nothing is built that is not a card").
# The board's built-in auto-add has a filter that lives in the project settings and skipped
# sub-issues (#211), so the repo does it itself. Issues only, never PRs: the issue card is the
# only card. addProjectV2ItemById is idempotent, so an issue already on the board is untouched.
#
# GITHUB_TOKEN cannot write to a user-owned project. The ADD_TO_BOARD_TOKEN secret must be a
# classic personal access token with the `project` scope (fine-grained tokens cannot reach
# user projects).

on:
  issues:
    types: [opened, reopened, transferred]
  workflow_dispatch: {}

permissions:
  issues: read

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - name: Check token
        env:
          TOKEN: ${{ secrets.ADD_TO_BOARD_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Repository secret ADD_TO_BOARD_TOKEN is missing. Add a classic PAT with the 'project' scope under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ADD_TO_BOARD_TOKEN }}
          script: |
            const PROJECT_ID = "PVT_kwHOAHEsTM4BlQbs"; // users/anujabbi/projects/2
            const add = async (nodeId, number) => {
              const res = await github.graphql(
                `mutation($p: ID!, $c: ID!) {
                   addProjectV2ItemById(input: {projectId: $p, contentId: $c}) { item { id } }
                 }`,
                { p: PROJECT_ID, c: nodeId });
              core.info(`#${number} -> ${res.addProjectV2ItemById.item.id}`);
            };

            if (context.eventName === "issues") {
              const issue = context.payload.issue;
              await add(issue.node_id, issue.number);
              return;
            }

            // workflow_dispatch: backfill every open issue (the issues API also returns PRs; skip them).
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: "open", per_page: 100,
            });
            const real = issues.filter(i => !i.pull_request);
            for (const i of real) await add(i.node_id, i.number);
            core.info(`Backfill done: ${real.length} open issues checked.`);
