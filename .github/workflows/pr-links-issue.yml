name: PR links an issue

# Friction, not enforcement: every PR should close an issue on the project board.
# This only comments when the body has no closing keyword; it never fails the PR.
# It also copies the needs-human label from any closed issue onto the PR, so the
# release agent (and scripts/board.sh merge) can see the hold without following links.

on:
  pull_request:
    types: [opened, edited, reopened]

permissions:
  pull-requests: write
  issues: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const closes = [...body.matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi)].map(m => Number(m[1]));
            const linked = closes.length > 0;
            const marker = "<!-- pr-links-issue -->";
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            // Propagate the human-in-the-loop hold from the closed issues to the PR.
            const prLabels = (context.payload.pull_request.labels || []).map(l => l.name);
            if (!prLabels.includes("needs-human")) {
              for (const n of closes) {
                const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: n }).catch(() => ({ data: null }));
                if (issue && issue.labels.some(l => l.name === "needs-human")) {
                  await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ["needs-human"] });
                  await github.rest.issues.createComment({ owner, repo, issue_number,
                    body: `<!-- needs-human -->\n**needs-human** copied from #${n}: the release agent will not merge this PR. When it reaches Ship, the owner decides and merges.` });
                  break;
                }
              }
            }
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (linked) {
              if (existing) await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id });
              return;
            }
            if (existing) return;
            await github.rest.issues.createComment({
              owner, repo, issue_number,
              body: `${marker}\nThis PR does not reference an issue. Add \`Closes #N\` to the description so the board card moves to Done on merge. All work is tracked through the project; if there is no issue yet, open one from the User story or Bug form first.`
            });
