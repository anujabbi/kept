name: PR links an issue

# Friction, not enforcement: every PR should close an issue on the project board.
# This only comments when the body has no closing keyword; it never fails the PR.

on:
  pull_request:
    types: [opened, edited, reopened]

permissions:
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const linked = /\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#\d+/i.test(body);
            const marker = "<!-- pr-links-issue -->";
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (linked) {
              if (existing) await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id });
              return;
            }
            if (existing) return;
            await github.rest.issues.createComment({
              owner, repo, issue_number,
              body: `${marker}\nThis PR does not reference an issue. Add \`Closes #N\` to the description so the board card moves to Done on merge. All work is tracked through the project; if there is no issue yet, open one from the User story or Bug form first.`
            });
