name: review-recorded

# Reports a commit status "review-recorded" on the PR head:
#   success  the newest review marker comment is review:approved for this head
#   failure  no marker for this head, or the newest one is review:changes
# Warn-only today: it is not a required check. Promote it in the branch rule
# for main once it has been watched on a few PRs.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created, edited]

permissions:
  statuses: write
  pull-requests: read
  issues: read

jobs:
  status:
    if: github.event_name == 'pull_request' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request?.number ?? context.payload.issue.number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            const head = pr.head.sha;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number, per_page: 100 });
            // When the head commit was pushed. A bare "/approve" or "/changes" comment posted
            // after that applies to this head; the agents' full marker names the head explicitly.
            const { data: headCommit } = await github.rest.repos.getCommit({ owner, repo, ref: head });
            const headAt = new Date(headCommit.commit.committer.date);
            const markers = comments.flatMap(c => {
              const body = c.body || "";
              const full = /<!--\s*review:(approved|changes)\s+head=([0-9a-f]+)\s*-->/.exec(body);
              if (full) return [{ verdict: full[1], head: full[2], at: c.created_at, url: c.html_url }];
              const short = /^\s*\/(approve|lgtm|changes|request-changes)\b/i.exec(body);
              if (short && new Date(c.created_at) > headAt) {
                const verdict = /^(approve|lgtm)$/i.test(short[1]) ? "approved" : "changes";
                return [{ verdict, head, at: c.created_at, url: c.html_url }];
              }
              return [];
            }).sort((a, b) => a.at.localeCompare(b.at));
            const latest = markers[markers.length - 1];
            let state, description, target_url;
            if (!latest) {
              state = "failure"; description = "No review recorded. Reviewer runs scripts/board.sh review; a human comments /approve.";
            } else if (latest.head !== head) {
              state = "failure"; description = `Last review (${latest.verdict}) was for ${latest.head.slice(0,7)}, head is ${head.slice(0,7)}.`; target_url = latest.url;
            } else if (latest.verdict === "changes") {
              state = "failure"; description = "Reviewer requested changes on this head."; target_url = latest.url;
            } else {
              state = "success"; description = "Reviewer approved this head."; target_url = latest.url;
            }
            core.info(`${state}: ${description}`);
            await github.rest.repos.createCommitStatus({ owner, repo, sha: head, state, context: "review-recorded", description: description.slice(0, 140), target_url });
