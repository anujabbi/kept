name: Feature
description: A user-facing capability that will be split into stories. The planner creates the stories as sub-issues.
title: "<capability, as the user would name it>"
labels: [enhancement, "type:feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who has it, when, and what it costs them today.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What is different for the user once the whole feature ships.
    validations:
      required: true
  - type: textarea
    id: stories
    attributes:
      label: Candidate stories
      description: Rough list, one per line. The planner turns these into story sub-issues.
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [P0 now, P1 next, P2 later]
    validations:
      required: true
