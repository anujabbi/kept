<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KEPT Sprig evolves</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<style>
body{margin:0}
a{color:#1E1B3C}a:hover{color:#5B4BD6}
.petal{position:absolute;top:-24px;width:10px;height:16px;border-radius:8px 8px 8px 2px;opacity:0;animation:petalFall 2.800s cubic-bezier(.2,.6,.4,1) both}
@keyframes petalFall{0%{opacity:0;transform:translateY(0) rotate(0)}10%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translateY(860px) rotate(360deg)}}
.pop{animation:pop .7s cubic-bezier(.3,1.600,.5,1) .15s both}
@keyframes pop{from{transform:translateY(120px) scale(.6);opacity:0}to{transform:none;opacity:1}}
.ring{animation:ring 1.400s ease-out .5s both}
@keyframes ring{from{transform:scale(.4);opacity:.9}to{transform:scale(1.600);opacity:0}}
@media (prefers-reduced-motion: reduce){.petal{display:none}.pop,.ring{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #FFF9F1; font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: #1E1B3C">

<div style="position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; padding: 0 28px 28px; background: #2B2760; color: #FFF4E4; overflow: hidden">
<sc-for list="{{petals}}" as="p" hint-placeholder-count="18"><span class="petal" style="left: {{p.x}}px; background: {{p.c}}; animation-delay: {{p.d}}s"></span></sc-for>
<p style="margin: 72px 0 0; font-size: 15px; font-weight: 700; color: #D8D3F5">14 days kept</p>
<h1 style="margin: 6px 0 0; font-size: 44px; line-height: 1; font-weight: 800; letter-spacing: -0.02em; text-align: center">Sprig is now Thicket</h1>
<div class="pop" style="position: relative; width: 280px; height: 280px; margin-top: 30px">
<span class="ring" style="position: absolute; left: 30px; top: 30px; width: 220px; height: 220px; border-radius: 110px; border: 6px solid rgba(255,194,61,0.8)"></span>
<span style="position: absolute; left: 40px; right: 40px; bottom: 6px; height: 26px; border-radius: 50%; background: rgba(255,194,61,0.25)"></span>
<dc-import name="SprigA" pose="cheer" stage="3" outfit="both" size="280" hint-size="280px,280px"></dc-import>
</div>
<p style="margin: 18px 0 0; font-size: 17px; line-height: 1.4; font-weight: 600; text-align: center; color: #D8D3F5">New outfit: a scarf and a cardigan. Next up is Grove, at day 30.</p>
<div style="margin-top: auto; width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<button type="button" style="height: 56px; border-radius: 28px; border: 2px solid #FFF4E4; background: none; color: #FFF4E4; font: inherit; font-size: 17px; font-weight: 700; cursor: pointer">Share</button>
<a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 28px; background: #FFC23D; color: #1E1B3C; font-size: 17px; font-weight: 700; text-decoration: none">Carry on</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const cols = ['#FF8FB0', '#FFFFFF', '#8B7CF6', '#2FA866', '#FFF4C2'];
    const petals = []; for (let i = 0; i < 18; i++) petals.push({ x: 8 + ((i * 47) % 370), c: cols[i % 5], d: ((i * 29) % 13) / 10 });
    return { petals: petals };
  }
}
</script>
</body>
</html>
