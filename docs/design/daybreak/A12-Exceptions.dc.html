<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KEPT what stays open</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<style>
body{margin:0}
a{color:#1E1B3C}a:hover{color:#5B4BD6}

</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #FFF9F1; font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: #1E1B3C">
<sc-if value="{{onb}}" hint-placeholder-val="{{ true }}"><div style="flex: none; display: flex; align-items: center; gap: 12px; padding: 24px 20px 4px 12px">
<a href="A11-Onb-Rule.dc.html" aria-label="Back" style="display: flex; align-items: center; justify-content: center; flex: none; width: 44px; height: 44px; border-radius: 22px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<div style="flex: 1; display: flex; gap: 6px" aria-label="Step 4 of 6"><span style="flex: 1; height: 6px; border-radius: 3px; background: #5B4BD6"></span><span style="flex: 1; height: 6px; border-radius: 3px; background: #5B4BD6"></span><span style="flex: 1; height: 6px; border-radius: 3px; background: #5B4BD6"></span><span style="flex: 1; height: 6px; border-radius: 3px; background: #5B4BD6"></span><span style="flex: 1; height: 6px; border-radius: 3px; background: #E6DCCE"></span><span style="flex: 1; height: 6px; border-radius: 3px; background: #E6DCCE"></span></div>
</div></sc-if>
<sc-if value="{{set}}" hint-placeholder-val="{{ false }}"><div style="flex: none; padding: 24px 12px 4px">
<a href="A7-Settings.dc.html" aria-label="Back" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 22px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
</div></sc-if><div style="flex: none; padding: 6px 24px 18px"><h1 style="margin: 0; font-size: 34px; line-height: 1.02; font-weight: 800; letter-spacing: -0.02em">What stays open?</h1><p style="margin: 8px 0 0; font-size: 15px; line-height: 1.4; font-weight: 500; color: #5C5878">Phone, messages, maps and camera always work. Add only apps you truly need: every exception is a gap in the lock.</p></div>
<div style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; padding: 0 20px 16px">
<div style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0 4px; font-size: 15px; font-weight: 700; color: #5C5878">Always open</h2>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{always}}" as="a" hint-placeholder-count="6"><span style="height: 32px; display: inline-flex; align-items: center; padding: 0 12px; border-radius: 16px; background: #EAF5EE; color: #1F6B3F; font-size: 13px; font-weight: 700">{{a.name}}</span></sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline; margin: 0 4px"><h2 style="margin: 0; font-size: 15px; font-weight: 700; color: #5C5878">Your exceptions</h2><span style="font-size: 13px; font-weight: 600; color: #5C5878">{{countLine}}</span></div>
<label style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 16px; background: #FFFFFF; border: 1.500px solid #E6DCCE; color: #8D88A8"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4-4"></path></svg><input type="search" placeholder="Search apps" aria-label="Search apps" style="flex: 1; border: 0; background: none; font: inherit; font-size: 15px; color: #1E1B3C; outline: none"></label>
<div style="border-radius: 22px; background: #FFFFFF; border: 1.500px solid #F1E8DC; overflow: hidden">
<sc-for list="{{apps}}" as="p" hint-placeholder-count="7">
<button type="button" role="switch" aria-checked="{{p.on}}" onClick="{{p.toggle}}" style="display: flex; align-items: center; gap: 12px; width: 100%; height: 56px; padding: 0 14px; border: 0; border-top: {{p.rule}}; background: none; font: inherit; color: #1E1B3C; text-align: left; cursor: pointer">
<span style="flex: none; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 10px; background: {{p.tile}}; color: #FFFFFF; font-size: 14px; font-weight: 800">{{p.initial}}</span>
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 700">{{p.name}}</span><span style="font-size: 12px; font-weight: 600; color: {{p.stateInk}}">{{p.state}}</span></span>
<span style="flex: none; position: relative; width: 48px; height: 28px; border-radius: 14px; background: {{p.track}}"><span style="position: absolute; top: 3px; left: {{p.knob}}px; width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF"></span></span>
</button>
</sc-for>
</div>
</div>
</div>
<sc-if value="{{onb}}" hint-placeholder-val="{{ true }}"><div style="flex: none; display: flex; flex-direction: column; gap: 8px; padding: 12px 20px 28px; border-top: 1.500px solid #EFE4D6"><a href="A13-Permissions.dc.html" style="display: flex; align-items: center; justify-content: center; width: 100%; height: 56px; border-radius: 28px; border: 0; background: #1E1B3C; color: #FFF9F1; font: inherit; font-size: 17px; font-weight: 700; text-decoration: none; cursor: pointer">Continue</a></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["onboarding","settings"],"default":"onboarding"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const on = st.on || { sp: true, gc: true };
    const src = [['sp', 'Spotify', '#1DB954'], ['gc', 'Google Classroom', '#1E8E3E'], ['ch', 'Chrome', '#4285F4'], ['ig', 'Instagram', '#C13584'], ['tt', 'TikTok', '#111111'], ['yt', 'YouTube', '#E62117'], ['wa', 'WhatsApp', '#25D366']];
    const n = src.filter((x) => on[x[0]]).length;
    const mode = this.props.mode || 'onboarding';
    return {
      onb: mode === 'onboarding', set: mode === 'settings',
      always: ['Phone', 'Messages', 'Maps', 'Camera', 'Settings', 'Clock'].map((x) => ({ name: x })),
      countLine: n === 0 ? 'Everything locks' : n === 1 ? '1 app stays open' : n + ' apps stay open',
      apps: src.map((x, i) => { const o = !!on[x[0]]; return { name: x[1], initial: x[1][0], tile: x[2], on: o,
        state: o ? 'Stays open' : 'Locks', stateInk: o ? '#1F6B3F' : '#5C5878', rule: i === 0 ? '0' : '1.500px solid #F1E8DC',
        track: o ? '#5B4BD6' : '#CFC8E6', knob: o ? 23 : 3, toggle: () => this.setState({ on: Object.assign({}, on, { [x[0]]: !o }) }) }; })
    };
  }
}
</script>
</body>
</html>
