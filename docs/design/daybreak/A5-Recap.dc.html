<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KEPT daily recap, Daybreak</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<style>
body{margin:0}
a{color:#FFF9F1}a:hover{color:#FFC23D}
.petal{position:absolute;top:-24px;width:10px;height:16px;border-radius:8px 8px 8px 2px;opacity:0;animation:petalFall 2.600s cubic-bezier(.2,.6,.4,1) both}
@keyframes petalFall{0%{opacity:0;transform:translateY(0) rotate(0)}10%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translateY(380px) rotate(320deg)}}
.grow{animation:grow 1.200s cubic-bezier(.3,1.300,.5,1) .9s both}
@keyframes grow{from{width:var(--from)}to{width:var(--to)}}
.knob{animation:knobPop .5s cubic-bezier(.3,1.800,.5,1) 2s both}
@keyframes knobPop{0%{transform:scale(1)}50%{transform:scale(1.350)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){.petal{animation:none;display:none}.grow,.knob{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #FFF9F1; font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: #1E1B3C">
<div style="position: relative; flex: none; height: 400px; overflow: hidden; background: {{sky}}">
<div style="position: absolute; left: 24px; right: 24px; top: 60px">
<h1 style="margin: 0; font-size: {{hSize}}px; line-height: 0.98; font-weight: 800; letter-spacing: -0.03em">{{headline}}</h1>
<p style="margin: 10px 0 0; font-size: 18px; line-height: 1.35; font-weight: 600; color: #3A3658">{{sub}}</p>
</div>
<div style="position: absolute; z-index: 0; isolation: isolate; left: 70px; top: {{sprigTop}}px">
<dc-import name="SprigA" outfit="{{outfit}}" pose="{{pose}}" stage="{{stage}}" size="250" hint-size="250px,250px"></dc-import>
</div>
<sc-if value="{{kept}}" hint-placeholder-val="{{ true }}">
<sc-for list="{{petals}}" as="p" hint-placeholder-count="14">
<span class="petal" style="left: {{p.x}}px; background: {{p.c}}; animation-delay: {{p.d}}s"></span>
</sc-for>
</sc-if>
</div>
<div style="position: relative; flex: none; height: 52px; margin: -48px -60px -4px; background: #FFF9F1; border-radius: 50% 50% 0 0 / 48px 48px 0 0"></div>
<div style="flex: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 0 24px; text-align: center">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 28px; line-height: 1.1; font-weight: 800; letter-spacing: -0.02em">{{doneValue}}</span><span style="font-size: 13px; font-weight: 600; color: #5C5878">habits done</span></div>
<div style="display: flex; flex-direction: column; gap: 2px; border-left: 1.500px solid #EADFD2"><span style="font-size: 28px; line-height: 1.1; font-weight: 800; letter-spacing: -0.02em">{{brokenValue}}</span><span style="font-size: 13px; font-weight: 600; color: #5C5878">{{brokenLabel}}</span></div>
</div>
<div style="flex: none; display: flex; flex-direction: column; gap: 14px; margin: 24px 20px 0; padding: 16px 16px 18px; border-radius: 24px; background: #F3EFFF">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<p style="margin: 0; font-size: 17px; font-weight: 800">{{nextLine}}</p>
<p style="margin: 0; font-size: 14px; font-weight: 600; color: #5C5878">{{nextCount}}</p>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<div style="flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px">
<dc-import name="SprigA" outfit="{{outfit}}" pose="idle" stage="{{stage}}" size="48" hint-size="48px,48px"></dc-import>
<span style="font-size: 12px; font-weight: 700">{{fromName}}</span>
</div>
<div style="position: relative; flex: 1; height: 16px; border-radius: 8px; background: #DCD6FA">
<div class="grow" style="--from: {{fromPct}}%; --to: {{toPct}}%; position: relative; height: 100%; width: {{toPct}}%; min-width: 16px; border-radius: 8px; background: #5B4BD6">
<span class="knob" style="position: absolute; right: -6px; top: -5px; width: 26px; height: 26px; box-sizing: border-box; border-radius: 13px; border: 4px solid #5B4BD6; background: #FFFFFF"></span>
</div>
<sc-for list="{{ticks}}" as="t" hint-placeholder-count="6">
<span style="position: absolute; top: 5px; left: {{t.x}}%; width: 6px; height: 6px; margin-left: -3px; border-radius: 3px; background: {{t.c}}"></span>
</sc-for>
</div>
<div style="flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px">
<div style="filter: brightness(0) opacity(0.22)">
<dc-import name="SprigA" outfit="{{nextOutfit}}" pose="idle" stage="{{nextStage}}" size="48" hint-size="48px,48px"></dc-import>
</div>
<span style="font-size: 12px; font-weight: 700; color: #5C5878">{{toName}}</span>
</div>
</div>
</div>
<div style="flex: 1"></div>
<div style="flex: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 0 20px 28px">
<button type="button" style="height: 56px; border-radius: 28px; border: 2px solid #1E1B3C; background: none; color: #1E1B3C; font: inherit; font-size: 17px; font-weight: 700; cursor: pointer">{{shareLabel}}</button>
<a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 28px; background: #1E1B3C; color: #FFF9F1; font-size: 17px; font-weight: 700; text-decoration: none">Done</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"outcome":{"editor":"enum","options":["kept","slipped","late","shield","lockoff","writtenoff"],"default":"kept"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const o = this.props.outcome || 'kept';
    const cols = ['#FF8FB0', '#FFFFFF', '#8B7CF6', '#2FA866', '#FFF4C2'];
    const petals = [];
    for (let i = 0; i < 14; i++) petals.push({ x: 12 + ((i * 53) % 360), c: cols[i % 5], d: ((i * 37) % 11) / 10 });
    // streak kept: kept / shield / lockoff. streak reset: slipped / late / writtenoff.
    const C = {
      kept: ['Promise kept.', '12 days running.', '#FFC23D', 'cheer', '2 of 2', '0'],
      shield: ['Shield saved it.', 'Your weekly shield kept the 12-day streak alive.', '#BFD9F2', 'idle', '1 of 2', '0'],
      lockoff: ['The lock was off.', 'That one is on us. Today does not count, but your 12-day streak is safe.', '#DCD6EA', 'idle', '2 of 2', '0'],
      slipped: ['The promise slipped.', 'Streak reset. Tomorrow is fresh.', '#CFCBDD', 'droop', '1 of 2', '1'],
      late: ['Too late to count.', 'Everything got ticked after the give-up time. Streak reset.', '#E9C3B0', 'droop', '2 of 2', '0'],
      writtenoff: ['Day written off.', 'A fourth break this week. Streak reset, and the shield could not save it.', '#CFCBDD', 'droop', '1 of 2', '4']
    }[o] || null;
    const kept = o === 'kept';
    const safe = o === 'kept' || o === 'shield' || o === 'lockoff';
    const span = safe ? 7 : 3;
    const into = safe ? 5 : 0;
    const toPct = Math.round(into / span * 100);
    const fromPct = kept ? Math.round(Math.max(0, into - 1) / span * 100) : toPct;
    const ticks = [];
    for (let k = 1; k < span; k++) ticks.push({ x: (k / span * 100).toFixed(2), c: k <= into ? 'rgba(255,255,255,0.55)' : 'rgba(91,75,214,0.25)' });
    return {
      kept: kept,
      petals: petals,
      headline: C[0], sub: C[1], sky: C[2], pose: C[3],
      hSize: kept ? 52 : 40,
      sprigTop: kept ? 150 : 172,
      doneValue: C[4], brokenValue: C[5], brokenLabel: C[5] === '1' ? 'lock broken' : 'locks broken',
      stage: safe ? 3 : 0, nextStage: safe ? 3 : 1,
      outfit: safe ? 'sweater' : 'none', nextOutfit: safe ? 'both' : 'scarf',
      fromName: safe ? 'Bloom' : 'Sprig', toName: safe ? 'Thicket' : 'Bud',
      nextLine: safe ? 'Thicket in 2 days' : 'Bud in 3 days',
      nextCount: safe ? 'Day 12 of 14' : 'Day 0 of 3',
      fromPct: fromPct, toPct: toPct, ticks: ticks,
      shareLabel: kept ? 'Share this look' : 'See my Sprigs'
    };
  }
}
</script>
</head>
