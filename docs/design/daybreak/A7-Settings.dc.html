<button type="button" class="row" role="switch" aria-checked="{{share}}" onClick="{{toggleShare}}"><span style="flex: 1; display: flex; flex-direction: column; padding: 10px 0"><span style="font-size: 16px; font-weight: 700">Send anonymous usage data</span><span style="font-size: 13px; line-height: 1.35; font-weight: 500; color: #5C5878">No name, no email, never which apps you use.</span></span><span style="flex: none; position: relative; width: 48px; height: 28px; border-radius: 14px; background: {{shareTrack}}; transition: background 0.2s"><span style="position: absolute; top: 3px; left: {{shareKnob}}px; width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF; transition: left 0.2s"></span></span></button>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const remind = st.remind !== false;
    const share = !!st.share;
    return {
      remind: remind, share: share,
      remindTrack: remind ? '#5B4BD6' : '#CFC8E6', remindKnob: remind ? 23 : 3,
      shareTrack: share ? '#5B4BD6' : '#CFC8E6', shareKnob: share ? 23 : 3,
      toggleRemind: () => this.setState({ remind: !remind }),
      toggleShare: () => this.setState({ share: !share })
    };
  }
}
</script>
