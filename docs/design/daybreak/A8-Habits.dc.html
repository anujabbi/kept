<span style="flex: 1; display: flex; flex-direction: column">

</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8D88A8" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
