<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KEPT onboarding, choose habits</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<style>
body{margin:0}
a{color:#1E1B3C}a:hover{color:#5B4BD6}

</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #FFF9F1; font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: #1E1B3C">
<div style="flex: none; display: flex; align-items: center; gap: 12px; padding: 24px 20px 4px 12px">
<a href="A1-Welcome.dc.html" aria-label="Back" style="display: flex; align-items: center; justify-content: center; flex: none; width: 44px; height: 44px; border-radius: 22px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<div style="flex: 1; display: flex; gap: 6px" aria-label="Step 1 of 5"><span style="flex: 1; height: 6px; border-radius: 3px; background: #5B4BD6"></span><span style="flex: 1; height: 6px; border-radius: 3px; background: #E6DCCE"></span><span style="flex: 1; height: 6px; border-radius: 3px; background: #E6DCCE"></span><span style="flex: 1; height: 6px; border-radius: 3px; background: #E6DCCE"></span><span style="flex: 1; height: 6px; border-radius: 3px; background: #E6DCCE"></span></div>
</div><div style="flex: none; padding: 6px 24px 18px"><h1 style="margin: 0; font-size: 34px; line-height: 1.02; font-weight: 800; letter-spacing: -0.02em">What will you do every day?</h1><p style="margin: 8px 0 0; font-size: 15px; line-height: 1.4; font-weight: 500; color: #5C5878">Pick two or three. You can change them later.</p></div>
<div style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 0 20px 16px">
<sc-for list="{{items}}" as="h" hint-placeholder-count="5">
<button type="button" onClick="{{h.toggle}}" aria-pressed="{{h.on}}" style="flex: none; display: flex; align-items: center; gap: 14px; height: 64px; padding: 0 14px; border-radius: 20px; border: 2px solid {{h.ring}}; background: {{h.bg}}; font: inherit; color: #1E1B3C; text-align: left; cursor: pointer">
<span style="display: flex; align-items: center; justify-content: center; flex: none; width: 40px; height: 40px; border-radius: 14px; background: #ECE9FF; color: #5B4BD6"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{h.icon}}"></path></svg></span>
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 700">{{h.title}}</span><span style="font-size: 13px; font-weight: 500; color: #5C5878">{{h.detail}}</span></span>
<span style="display: flex; align-items: center; justify-content: center; flex: none; width: 28px; height: 28px; border-radius: 14px; box-sizing: border-box; border: 2px solid {{h.ring2}}; background: {{h.dot}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.400" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="opacity: {{h.tick}}"><path d="M5 12.500l4.500 4.500L19 7.500"></path></svg></span>
</button>
</sc-for>
<a href="A9-Habit-edit.dc.html" style="flex: none; display: flex; align-items: center; gap: 14px; height: 64px; padding: 0 14px; border-radius: 20px; border: 2px dashed #CFC8E6; text-decoration: none"><span style="display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 14px; background: #FFFFFF; color: #5B4BD6"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span><span style="font-size: 16px; font-weight: 700">Add your own</span></a>
</div><div style="flex: none; display: flex; flex-direction: column; gap: 8px; padding: 12px 20px 28px; border-top: 1.500px solid #EFE4D6"><a href="A11-Onb-Rule.dc.html" style="display: flex; align-items: center; justify-content: center; width: 100%; height: 56px; border-radius: 28px; border: 0; background: {{nextBg}}; color: #FFF9F1; font: inherit; font-size: 17px; font-weight: 700; text-decoration: none; cursor: pointer">Continue</a><p style="margin: 0; text-align: center; font-size: 13px; font-weight: 600; color: #5C5878">{{countLine}}</p></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const on = st.on || { ex: true, rd: true };
    const I = {"run": "M13 4a1.500 1.500 0 1 0 .010 0M7 21l3-6 3 2v4M10 15l1-5 4 2 3-1M11 10l-3 1-1 3", "book": "M4 5c3-1 6-1 8 1v13c-2-2-5-2-8-1zM20 5c-3-1-6-1-8 1v13c2-2 5-2 8-1z", "music": "M9 18V5l11-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM20 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z", "cap": "M2 9l10-5 10 5-10 5zM6 11v5c3 2 9 2 12 0v-5", "broom": "M14 3l-4 9M7 12h8l2 9H5z", "moon": "M20 14A8 8 0 1 1 10 4a6 6 0 0 0 10 10z"};
    const src = [['ex', 'Exercise', '30 min', I.run], ['rd', 'Read', '10 pages', I.book], ['pr', 'Practice', '20 min', I.music], ['st', 'Study', '45 min', I.cap], ['td', 'Tidy room', 'Photo check-in', I.broom]];
    const n = src.filter((x) => on[x[0]]).length;
    return {
      items: src.map((x) => { const o = !!on[x[0]]; return { title: x[1], detail: x[2], icon: x[3], on: o,
        ring: o ? '#5B4BD6' : '#F1E8DC', bg: o ? '#F3EFFF' : '#FFFFFF', ring2: o ? '#5B4BD6' : '#CFC8E6', dot: o ? '#5B4BD6' : 'transparent', tick: o ? 1 : 0,
        toggle: () => this.setState({ on: Object.assign({}, on, { [x[0]]: !o }) }) }; }),
      nextBg: n ? '#1E1B3C' : '#B9B4CC',
      countLine: n === 0 ? 'Pick at least one' : n === 1 ? '1 habit picked' : n + ' habits picked'
    };
  }
}
</script>
</body>
</html>
